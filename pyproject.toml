[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "health-advisor"
version = "0.2.0"
description = "Local-first data-driven fat-loss advisor for body composition, sleep, Strava, and food logs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
maintainers = [{name = "shkyyy18"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
xiaomi = [
  "mijiaAPI>=4.1,<5",
  "qrcode[pil]>=8,<9",
]

[project.urls]
Homepage = "https://github.com/shkyyy18/health-advisor-internal"
Repository = "https://github.com/shkyyy18/health-advisor-internal"
Issues = "https://github.com/shkyyy18/health-advisor-internal/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "docs*", "logs*", "scripts*", "tests*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.html", "static/css/*.css", "static/js/*.js"]
