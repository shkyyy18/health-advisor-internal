[project]
name = "health-assistant"
version = "0.1.0"
description = "Personal health data hub for Strava and Xiaomi devices"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
xiaomi = [
  "mijiaAPI>=4.1,<5",
  "qrcode[pil]>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]